name: Sync Missing Tags

on:
  schedule:
    # Runs daily at 6am
    - cron: "0 20 * * *"
  workflow_dispatch: # Allows manual trigger

# Least privilege: branch/tag pushes authenticate with EVCC_PAT (set via
# checkout); GITHUB_TOKEN is used only by `gh pr create`, which needs
# pull-requests: write.
permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all branches and tags
          token: ${{ secrets.EVCC_PAT }}

      - name: Set up Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Add public repo as remote
        run: |
          git remote add public https://github.com/evcc-io/evcc.git

      - name: Fetch tags from the public repo
        run: |
          git fetch public --tags

      - name: Get all tags from the public repo
        id: get-public-tags
        run: |
          git tag -l | grep -E '^0\.[0-9]+\.[0-9]+$' > public_tags.txt
          echo "Public tags:"
          cat public_tags.txt

      - name: Get existing tags in the repo
        id: get-existing-tags
        run: |
          git tag -l | grep -E '^0\.[0-9]+\.[0-9]+\.0$' > existing_tags.txt
          echo "Existing tags:"
          cat existing_tags.txt

      - name: Sync missing tags
        run: |
          # Define the starting tag
          START_TAG="0.130.7"

          # Convert version to numeric format for comparison
          tag_to_numeric() {
            echo "$1" | sed 's/\./_/g' | awk -F'_' '{ printf("%d%03d%03d", $1, $2, $3) }'
          }

          START_NUMERIC=$(tag_to_numeric $START_TAG)

          # Read tags from files
          PUBLIC_TAGS=$(cat public_tags.txt)
          EXISTING_TAGS=$(cat existing_tags.txt)

          # Only sync tags NEWER than the latest already-released one. An older
          # upstream tag is superseded by a newer release, so we must not keep
          # recreating its branch/PR (e.g. 0.314.0 once 0.314.2.0 is released -
          # its .0 will never exist, so the plain "missing tag" check reopened the
          # release PR on every run). tag_to_numeric ignores the 4th (.0) field,
          # so an existing 0.314.2.0 maps to the same value as public tag 0.314.2.
          LATEST_NUMERIC=$START_NUMERIC
          for T in $EXISTING_TAGS; do
            N=$(tag_to_numeric "$T")
            if [ "$N" -gt "$LATEST_NUMERIC" ]; then
              LATEST_NUMERIC=$N
            fi
          done
          echo "Latest released tag (numeric floor): $LATEST_NUMERIC"

          for TAG in $PUBLIC_TAGS; do
            # Convert the current tag to numeric format
            TAG_NUMERIC=$(tag_to_numeric $TAG)

            # Only process tags newer than the latest already-released tag
            if [ "$TAG_NUMERIC" -gt "$LATEST_NUMERIC" ]; then
              # Generate the new tag name with .0 suffix
              NEW_TAG="${TAG}.0"

              # Check if the tag already exists
              if ! echo "$EXISTING_TAGS" | grep -q "^${NEW_TAG}$"; then
                echo "Processing new tag: $NEW_TAG"

                # Choose what to fold into the tag branch.
                #
                # Feature releases (patch 0, e.g. 0.314.0) are cut by upstream
                # from their master, so we fold in OUR master (fork features on
                # top of that feature base).
                #
                # Patch releases (patch >0, e.g. 0.314.5) are cut by upstream
                # from a release/0.X branch and share the 0.X.0 base. Folding in
                # master would drag the entire master-vs-release-line divergence
                # (UI/library migrations, API signature changes, ...) into an old
                # stable line and cause large, recurring conflicts. Instead fold
                # in our OWN finished feature-release branch tag-0.X.0: the merge
                # base is then 0.X.0, so the only deltas are the backported
                # bugfixes plus our fork features. Master keeps advancing
                # independently for the nightly build.
                #
                # Guard: only use tag-0.X.0 once that feature release is actually
                # finalized (its 0.X.0.0 tag exists); before that its branch is
                # bare upstream 0.X.0 with none of our fork changes, so fall back
                # to master.
                MINOR="${TAG%.*}"   # 0.X
                PATCH="${TAG##*.}"  # Y
                MERGE_SRC="master"
                PR_HEAD="master"
                FEATURE_BRANCH="tag-${MINOR}.0"
                if [ "$PATCH" != "0" ] && [ -n "$(git tag -l "${MINOR}.0.0")" ]; then
                  if git rev-parse --verify --quiet "refs/heads/${FEATURE_BRANCH}" >/dev/null; then
                    MERGE_SRC="${FEATURE_BRANCH}"       # created earlier in this run
                    PR_HEAD="${FEATURE_BRANCH}"
                  elif git rev-parse --verify --quiet "origin/${FEATURE_BRANCH}" >/dev/null; then
                    MERGE_SRC="origin/${FEATURE_BRANCH}" # from a previous run
                    PR_HEAD="${FEATURE_BRANCH}"
                  fi
                fi
                echo "Folding ${MERGE_SRC} into tag-${TAG}"

                # Create a new branch for the tag
                git checkout -b "tag-${TAG}" ${TAG}

                # Attempt to merge the chosen source into the new branch
                git merge "$MERGE_SRC" --no-edit || {
                  echo "Merge conflict detected for tag ${TAG}. Attempting auto-resolution."

                  # Auto-resolve conflicts that are confined to the fork's known,
                  # permanent divergences from upstream in .github/workflows/:
                  # deleted workflows, removed jobs (apt, Home Assistant add-on, ...)
                  # and runner type. Any other conflict is left untouched so the
                  # sync opens a pull request. See resolve_tag_sync.py for details.
                  # The script is merged in cleanly from master, so it is present
                  # in the working tree even though the upstream tag lacks it.
                  python3 .github/scripts/resolve_tag_sync.py

                  # If any conflicts remain, hand off to a manual pull request.
                  if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                    echo "Unresolved conflicts remain for tag ${TAG}. Creating pull request."
                    git merge --abort
                    git push origin "tag-${TAG}"
                    gh pr create --title "Resolve merge conflict for tag ${NEW_TAG}" --body "A merge conflict was detected while syncing tag ${NEW_TAG} (folding ${PR_HEAD} into tag-${TAG}). Please resolve the conflict in this PR." --head "$PR_HEAD" --base "tag-${TAG}"
                    continue
                  fi

                  # All conflicts were fork divergences; finalize the auto-resolved merge.
                  echo "All conflicts were fork divergences. Committing auto-resolved merge."
                  git commit --no-edit
                }
                # Tag the branch with .0 appended to the original tag name
                git tag "${NEW_TAG}"

                # Push the new branch and tag to your repository
                git push origin "tag-${TAG}"
                git push origin "${NEW_TAG}"
              fi
            fi
          done

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
