name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "*"

jobs:
  call-build-workflow:
    if: startsWith(github.ref, 'refs/tags')
    uses: jeffborg/evcc/.github/workflows/default.yml@master
    permissions:
      contents: read
      actions: write

  release:
    name: Create GitHub Release
    needs:
      - docker
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  docker:
    name: Publish Docker :release
    needs:
      - call-build-workflow
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    env:
      # surfaced at job level because the secrets context is not available to a
      # step's `if`; lets the Docker Hub login skip itself when unconfigured
      DOCKER_USER: ${{ secrets.DOCKER_USER }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Login to Docker Hub
        # The Dockerfile's base images (golang, alpine) and buildkit itself are
        # pulled from Docker Hub. Anonymous pulls share the runner IP's quota and
        # hit "429 Too Many Requests"; authenticated pulls get their own, far
        # higher quota. Must run before Setup Buildx, which pulls moby/buildkit.
        # Skipped when no credentials are configured, so forks still build.
        if: env.DOCKER_USER != ''
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Login
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull buildkit
        # Setup Buildx pulls moby/buildkit from Docker Hub with no retry, so a
        # single transient Hub failure kills the whole release. All three of
        # 429, 500 and an auth.docker.io timeout were hit on 0.317.0.0. Pull it
        # here with backoff so Setup Buildx finds the image already local.
        # No non-Hub mirror of moby/buildkit exists, unlike the base images.
        # If the action ever changes its default image this becomes a harmless
        # no-op rather than a failure.
        run: |
          for i in 1 2 3 4 5; do
            if docker pull --quiet moby/buildkit:buildx-stable-1; then exit 0; fi
            echo "::warning::buildkit pull attempt $i failed, retrying"
            sleep $((i * 15))
          done
          echo "::error::could not pull moby/buildkit after 5 attempts"
          exit 1

      - name: Setup Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/jeffborg/evcc

      - name: Publish
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v6
          push: true
          build-args: |
            RELEASE=1
          tags: ${{ steps.meta.outputs.tags }}
